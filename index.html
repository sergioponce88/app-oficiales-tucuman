<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actuaciones Sumariales · Policía de Tucumán</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Actuaciones">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #0b1220; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: #0b1220;
            color: #7dd3fc; font: 600 14px/1.3 system-ui, sans-serif; letter-spacing: .2em; transition: opacity .5s; z-index: 2; }
  #splash img { width: 110px; filter: drop-shadow(0 0 18px rgba(56,189,248,.6)); animation: p 1.8s ease-in-out infinite; }
  @keyframes p { 50% { transform: scale(1.05); } }
  #inst { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 3; display: none; padding: 12px 14px; border-radius: 14px;
          background: linear-gradient(135deg,#f59e0b,#f97316); color: #1c1002; font: 700 15px system-ui, sans-serif; border: 0;
          box-shadow: 0 10px 30px -10px rgba(249,115,22,.8); }
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""><div>POLICÍA DE TUCUMÁN</div></div>
<iframe id="app" src="https://sistemaoftuc.streamlit.app/?embed=true&embed_options=dark_theme" allow="clipboard-write; camera; microphone; geolocation"></iframe>
<button id="inst">📲 Instalar en este celular</button>
<script>
  const f = document.getElementById("app"), sp = document.getElementById("splash");
  f.addEventListener("load", () => setTimeout(() => { sp.style.opacity = 0; setTimeout(() => sp.remove(), 600); }, 1200));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  let aviso = null; const b = document.getElementById("inst");
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); aviso = e; b.style.display = "block"; });
  b.onclick = async () => { if (!aviso) return; aviso.prompt(); await aviso.userChoice; aviso = null; b.style.display = "none"; };
</script>
</body>
</html>
