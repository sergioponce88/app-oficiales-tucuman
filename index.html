<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actuaciones Sumariales · Policía de Tucumán</title>
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Actuaciones">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #0b1220; }
  #splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: #0b1220;
            color: #7dd3fc; font: 600 14px/1.3 system-ui, sans-serif; letter-spacing: .2em; transition: opacity .5s; z-index: 2; }
  #splash img { width: 110px; filter: drop-shadow(0 0 18px rgba(56,189,248,.6)); animation: p 1.8s ease-in-out infinite; }
  @keyframes p { 50% { transform: scale(1.05); } }
  #inst { position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 3; display: none; padding: 14px 44px 14px 16px; border-radius: 16px;
          background: linear-gradient(135deg,#f59e0b,#f97316); color: #1c1002; font: 700 16px/1.35 system-ui, sans-serif; border: 0;
          box-shadow: 0 10px 30px -10px rgba(249,115,22,.8); text-align: left; max-width: 560px; margin: 0 auto; }
  #inst small { display: block; font-weight: 600; font-size: 14px; margin-top: 4px; }
  #cerrar { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.18);
            color: #1c1002; font: 700 16px system-ui; }
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""><div>POLICÍA DE TUCUMÁN</div></div>
<iframe id="app" src="https://sistemaoftuc.streamlit.app/?embed=true&embed_options=dark_theme" allow="clipboard-write; camera; microphone; geolocation"></iframe>
<div id="inst" role="button"><span id="itxt">📲 Instalar la app en este dispositivo</span><button id="cerrar" aria-label="Cerrar">✕</button></div>
<script>
  const f = document.getElementById("app"), sp = document.getElementById("splash");
  f.addEventListener("load", () => setTimeout(() => { sp.style.opacity = 0; setTimeout(() => sp.remove(), 600); }, 1200));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  let aviso = null;
  const b = document.getElementById("inst"), t = document.getElementById("itxt");
  const instalada = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let cerrado = false; try { cerrado = localStorage.getItem("inst_cerrado") === "1"; } catch (e) {}
  const mostrar = html => { if (instalada || cerrado) return; t.innerHTML = html; b.style.display = "block"; };
  document.getElementById("cerrar").onclick = ev => { ev.stopPropagation(); b.style.display = "none";
    try { localStorage.setItem("inst_cerrado", "1"); } catch (e) {} };
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); aviso = e; mostrar("📲 Instalar la app en este dispositivo<small>Tocá acá</small>"); });
  b.onclick = async () => { if (!aviso) return; aviso.prompt(); await aviso.userChoice; aviso = null; b.style.display = "none"; };
  window.addEventListener("appinstalled", () => { b.style.display = "none"; });
  if (ios) {
    setTimeout(() => mostrar("📲 Para instalar la app<small>Abrí esta página en <b>Safari</b>, tocá <b>Compartir</b> (el cuadrado con la flecha ⬆️) y elegí <b>«Agregar a inicio»</b>.</small>"), 2500);
  } else {
    setTimeout(() => { if (!aviso) mostrar("📲 Para instalar la app<small>Tocá el menú <b>⋮</b> del navegador (arriba a la derecha) y elegí <b>«Instalar app»</b> o <b>«Agregar a pantalla principal»</b>.</small>"); }, 5000);
  }
</script>
</body>
</html>
